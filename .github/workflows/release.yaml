name: Release Module

on:
  push:
    tags:
      - "v*" # Runs when a version tag such as v1.2.0 is pushed.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a release tag in vMAJOR.MINOR.PATCH format."
            exit 1
          }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Patch module.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          test -n "$VERSION"
          jq --arg version "$VERSION" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/${GITHUB_REF_NAME}/module.zip" \
             '.version = $version | .manifest = $manifest | .download = $download' \
             module.json > module.tmp
          mv module.tmp module.json
        working-directory: ./lopest-shared-data

      - name: Package Foundry module
        run: |
          test -f module.json
          test -d assets
          test -d packs
          zip -r module.zip module.json assets packs
          unzip -Z1 module.zip | grep -qx 'module.json'
        working-directory: ./lopest-shared-data

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: false
          artifacts: "./lopest-shared-data/module.json,./lopest-shared-data/module.zip"